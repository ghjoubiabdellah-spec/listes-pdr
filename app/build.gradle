plugins {
    id 'com.android.application'
}

android {
    namespace 'com.listespdr.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.listespdr.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // Fixed key kept in the repository so every new build installs as an update
    // (same signature) and the lists and photos already on the phone are kept.
    signingConfigs {
        pdr {
            storeFile file('listes-pdr.keystore')
            storePassword 'listespdr'
            keyAlias 'listespdr'
            keyPassword 'listespdr'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.pdr
        }
        debug {
            signingConfig signingConfigs.pdr
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
