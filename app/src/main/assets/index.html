<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Listes PDR</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1D6670">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-column phone app — sticky header, sections drawn like shelf labels, quick-add bar pinned to the bottom */
:root{
  --bg:#EDF1F2; --surface:#FFFFFF; --surface-2:#F5F8F8; --ink:#16262A; --muted:#5B6D72; --line:#D3DBDD;
  --accent:#1D6670; --accent-ink:#FFFFFF; --accent-soft:#D8EBED;
  --label:#F3C33E; --label-ink:#2A2205; --danger:#B3362B; --danger-soft:#F7E1DE; --done:#8C979A;
  --shadow:0 10px 30px rgba(16,38,42,.18);
  --display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111A1C; --surface:#1A2427; --surface-2:#202C30; --ink:#E3ECEE; --muted:#93A5AA; --line:#2C3B3F;
  --accent:#5DB3BD; --accent-ink:#0B1A1C; --accent-soft:#1D3A3E;
  --label:#E0B53B; --label-ink:#221B03; --danger:#E46B60; --danger-soft:#3A2220; --done:#66777B;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#111A1C; --surface:#1A2427; --surface-2:#202C30; --ink:#E3ECEE; --muted:#93A5AA; --line:#2C3B3F;
  --accent:#5DB3BD; --accent-ink:#0B1A1C; --accent-soft:#1D3A3E;
  --label:#E0B53B; --label-ink:#221B03; --danger:#E46B60; --danger-soft:#3A2220; --done:#66777B;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark; }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:760px;margin:0 auto;min-height:100%;padding-bottom:150px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 12px;display:grid;gap:10px}
.toprow{display:flex;align-items:center;gap:8px;min-height:44px}
.titles{flex:1;min-width:0}
.titles h1{margin:0;font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.01em;line-height:1.05;text-wrap:balance;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.titles p{margin:2px 0 0;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.icon{width:44px;height:44px;flex:none;display:grid;place-items:center;border:0;border-radius:12px;background:transparent;color:var(--ink)}
.icon:active{background:var(--surface-2)}
.icon svg{width:24px;height:24px}
.searchrow{display:flex;gap:8px;align-items:center}
.search{flex:1;min-width:0;position:relative}
.search svg{position:absolute;left:12px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{width:100%;box-sizing:border-box;height:42px;padding:0 12px 0 38px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2)}
.chip{height:42px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}

main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px}

/* home */
.lists{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.list-card{width:100%;text-align:left;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:16px;border-radius:16px;border:1px solid var(--line);background:var(--surface)}
.list-card:active{background:var(--surface-2)}
.list-card .name{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.1;min-width:0;overflow-wrap:anywhere}
.list-card .meta{grid-column:1;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.list-card .go{grid-row:1/3;grid-column:2;color:var(--muted)}
.home-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.btn{height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.armed{background:var(--danger);border-color:var(--danger);color:#fff}
.btn svg{width:18px;height:18px}
.note-mode{margin-top:22px;color:var(--muted);font-size:13px;max-width:60ch}
.empty{padding:28px 18px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:16px;background:var(--surface)}
.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.hits-title{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:4px 0 8px}

/* sections */
.sec{margin-bottom:18px}
.sec-head{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.sec-toggle{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:4px 0;text-align:left}
.shelf{display:inline-block;background:var(--label);color:var(--label-ink);font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.07em;text-transform:uppercase;padding:4px 10px 3px;border-radius:4px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;box-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}
.sec-count{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chev{width:18px;height:18px;color:var(--muted);transition:transform .15s;flex:none}
.sec.closed .chev{transform:rotate(-90deg)}
.sec.closed .items{display:none}
.icon.sm{width:36px;height:36px;border-radius:10px}
.icon.sm svg{width:20px;height:20px}
.items{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:4px;min-height:52px;border-top:1px solid var(--line);padding-right:12px}
.row:first-child{border-top:0}
.tick{width:48px;height:52px;flex:none;border:0;background:transparent;display:grid;place-items:center}
.tick span{width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;box-sizing:border-box}
.tick svg{width:14px;height:14px;color:var(--accent-ink);opacity:0}
.row.is-checked .tick span{background:var(--accent);border-color:var(--accent)}
.row.is-checked .tick svg{opacity:1}
.row-body{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:8px 4px;display:flex;flex-direction:column;gap:1px}
.code{font-family:var(--mono);font-weight:600;font-size:15px;letter-spacing:.02em;overflow-wrap:anywhere}
.row .note{font-size:13px;color:var(--muted);font-style:italic;overflow-wrap:anywhere}
.qty{font-family:var(--mono);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;min-width:44px;text-align:right;white-space:nowrap}
.qty.zero{color:var(--danger)}
.qty.none{color:var(--muted)}
.thumb{width:40px;height:40px;border-radius:8px;object-fit:cover;flex:none;background:var(--surface-2);border:1px solid var(--line)}
.row.is-checked .code,.row.is-checked .qty{text-decoration:line-through;color:var(--done)}
.row.is-checked .thumb{opacity:.5}
.sec-empty{padding:12px 16px;color:var(--muted);font-size:13px;background:var(--surface);border:1px dashed var(--line);border-radius:14px}
.where{font-size:12px;color:var(--muted)}

/* quick-add bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(0,0,0,.06);
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-top:8px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.bar-inner{max-width:760px;margin:0 auto;display:grid;grid-template-columns:46px 1fr 64px 46px;gap:8px}
.cam-btn{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);display:grid;place-items:center;padding:0;overflow:hidden;position:relative}
.cam-btn svg{width:22px;height:22px}
.cam-btn img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bar label.sec-pick{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.bar select{flex:1;min-width:0;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);padding:0 8px;font-size:14px;color:var(--ink)}
.bar input{height:46px;min-width:0;box-sizing:border-box;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);padding:0 12px}
#add-code{font-family:var(--mono);text-transform:uppercase}
#add-qty{text-align:center;font-family:var(--mono)}
.add-btn{height:46px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.add-btn svg{width:22px;height:22px}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:20;background:rgba(10,20,22,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92%;overflow:auto;box-sizing:border-box;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:var(--shadow);
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-top:8px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet h2{margin:0 0 14px;font-family:var(--display);font-weight:700;font-size:22px;text-wrap:balance}
.field{display:grid;gap:6px;margin-bottom:14px}
.field>label,.field>.lab{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field input[type=text],.field input:not([type]),.field select{height:46px;box-sizing:border-box;width:100%;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);padding:0 12px}
#f-code{font-family:var(--mono);font-weight:600;text-transform:uppercase}
.stepper{display:grid;grid-template-columns:52px 1fr 52px;gap:8px}
.stepper button{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:22px;font-weight:600}
.stepper input{text-align:center;font-family:var(--mono);font-size:18px;font-weight:600}
.photo-box{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.photo-box img{width:96px;height:96px;object-fit:cover;border-radius:12px;border:1px solid var(--line);background:var(--surface-2)}
.photo-ph{width:96px;height:96px;border-radius:12px;border:1.5px dashed var(--line);display:grid;place-items:center;color:var(--muted)}
.photo-ph svg{width:30px;height:30px}
.photo-btns{display:flex;flex-direction:column;gap:6px;flex:1;min-width:150px}
.photo-btns .btn{height:40px;font-size:14px;justify-content:center}
.checkline{display:flex;align-items:center;gap:10px;margin:4px 0 18px;font-weight:500}
.checkline input{width:22px;height:22px;accent-color:var(--accent)}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end}
.actions .spacer{flex:1}
.actions.two{display:grid;grid-template-columns:1fr 2fr}
.actions.two .btn{justify-content:center}
.del-line{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);display:flex;justify-content:center}
.del-line .btn{border-color:transparent;background:transparent}
.menu{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.menu button{width:100%;text-align:left;min-height:50px;border:0;border-radius:12px;background:transparent;padding:0 12px;display:flex;align-items:center;gap:12px;font-weight:500}
.menu button:active{background:var(--surface-2)}
.menu button svg{width:20px;height:20px;color:var(--muted);flex:none}
.menu button.danger{color:var(--danger)}
.menu button.danger svg{color:var(--danger)}
.menu button.armed{background:var(--danger);color:#fff}
.menu button.armed svg{color:#fff}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
textarea.csv{width:100%;box-sizing:border-box;height:180px;font-family:var(--mono);font-size:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);padding:10px}

.viewer{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.9);display:grid;place-items:center;padding:20px}
.viewer img{max-width:100%;max-height:100%;border-radius:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(130px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:min(90vw,420px);box-shadow:var(--shadow)}
.progress{height:4px;border-radius:2px;background:rgba(255,255,255,.25);margin-top:8px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--label);width:0}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="app">
  <header class="top" id="top">
    <div class="toprow">
      <button class="icon" id="btn-back" type="button" aria-label="Retour aux listes" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="titles"><h1 id="title">Listes PDR</h1><p id="subtitle">Chargement…</p></div>
      <button class="icon" id="btn-menu" type="button" aria-label="Menu de la liste" hidden>
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
      </button>
    </div>
    <div class="searchrow">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Chercher un code ou une note" autocomplete="off" aria-label="Rechercher">
      </div>
      <button class="chip" id="btn-hide" type="button" aria-pressed="false" hidden>Masquer cochés</button>
    </div>
  </header>
  <main id="main" aria-live="polite"></main>
</div>

<form class="bar" id="bar" hidden autocomplete="off">
  <div class="bar-inner">
    <label class="sec-pick" for="add-section">Section <select id="add-section"></select></label>
    <button class="cam-btn" type="button" id="add-photo" aria-label="Ajouter une photo à la nouvelle pièce">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      <img id="add-photo-img" alt="Photo choisie" hidden>
    </button>
    <input id="add-code" placeholder="Code de la pièce" aria-label="Code de la pièce" enterkeyhint="next" autocapitalize="characters">
    <input id="add-qty" placeholder="Qté" aria-label="Quantité" inputmode="numeric" enterkeyhint="done">
    <button class="add-btn" type="submit" aria-label="Ajouter la pièce">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>
</form>

<div class="sheet-wrap" id="sheet-wrap" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="viewer" id="viewer" hidden><img id="viewer-img" alt="Photo de la pièce"></div>
<div class="toast" id="toast" role="status" hidden></div>
<input type="file" id="file-csv" accept=".csv,text/csv,text/plain" hidden>
<input type="file" id="file-cam" accept="image/*" capture="environment" hidden>
<input type="file" id="file-gal" accept="image/*" hidden>
<input type="file" id="file-add" accept="image/*" hidden>

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('fr-FR');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const ICON={
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
  file:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4M9 14h6M9 17h6"/></svg>',
  dl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>',
  ul:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M7 9l5-5 5 5M5 20h14"/></svg>',
  undo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  chev:'<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
  dots:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>',
  go:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  cam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  rename:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V5h16v2M12 5v14M9 19h6"/></svg>'
};

/* ---------- state ---------- */
const S={lists:new Map(),items:new Map(),ready:false,mode:null};
const V={screen:'home',listId:null,q:'',hideChecked:!!ls.get('pdr.hide',false),collapsed:new Set(ls.get('pdr.collapsed',[])),lastSection:ls.get('pdr.lastsec',{})};
let assets=null, downloads=null;

/* ---------- stores ---------- */
const DbStore={
  init(db){
    this.db=db; this.subs=new Map();
    db.collection('lists').onSnapshot(snap=>{
      const seen=new Set();
      for(const d of snap.docs){ seen.add(d.id); S.lists.set(d.id,Object.assign({id:d.id},d.data())); if(!this.subs.has(d.id)) this.watch(d.id); }
      for(const id of [...S.lists.keys()]) if(!seen.has(id)){ S.lists.delete(id); S.items.delete(id); const u=this.subs.get(id); if(u) u(); this.subs.delete(id); }
      S.ready=true; schedule();
    },()=>toast('Connexion perdue. Rechargez la page.'));
  },
  watch(listId){
    const u=this.db.collection('lists/'+listId+'/items').onSnapshot(snap=>{
      const m=new Map(); for(const d of snap.docs) m.set(d.id,Object.assign({id:d.id},d.data()));
      S.items.set(listId,m); schedule();
    },()=>{});
    this.subs.set(listId,u);
  },
  setList(id,d){return this.db.doc('lists/'+id).set(d)},
  updateList(id,p){return this.db.doc('lists/'+id).update(p)},
  delList(id){return this.db.doc('lists/'+id).delete()},
  setItem(l,id,d){return this.db.doc('lists/'+l+'/items/'+id).set(d)},
  updateItem(l,id,p){return this.db.doc('lists/'+l+'/items/'+id).update(p)},
  delItem(l,id){return this.db.doc('lists/'+l+'/items/'+id).delete()}
};
const LocalStore={
  key:'pdr.local.v1',hold:false,
  init(){
    const d=ls.get(this.key,{lists:{},items:{}});
    for(const id in d.lists) S.lists.set(id,Object.assign({id},d.lists[id]));
    for(const lid in d.items){ const m=new Map(); for(const id in d.items[lid]) m.set(id,Object.assign({id},d.items[lid][id])); S.items.set(lid,m); }
    S.ready=true; schedule();
  },
  save(){
    if(this.hold){schedule();return}
    const out={lists:{},items:{}};
    for(const [id,l] of S.lists){const r=Object.assign({},l);delete r.id;out.lists[id]=r}
    for(const [lid,m] of S.items){out.items[lid]={};for(const [id,it] of m){const r=Object.assign({},it);delete r.id;out.items[lid][id]=r}}
    try{localStorage.setItem(this.key,JSON.stringify(out))}catch(e){toast("La mémoire du navigateur est pleine. Retirez des photos.")}
    schedule();
  },
  async setList(id,d){S.lists.set(id,Object.assign({id},d)); if(!S.items.has(id)) S.items.set(id,new Map()); this.save()},
  async updateList(id,p){const l=S.lists.get(id); if(l) S.lists.set(id,Object.assign({},l,p)); this.save()},
  async delList(id){S.lists.delete(id); S.items.delete(id); this.save()},
  async setItem(l,id,d){if(!S.items.has(l)) S.items.set(l,new Map()); S.items.get(l).set(id,Object.assign({id},d)); this.save()},
  async updateItem(l,id,p){const m=S.items.get(l); const it=m&&m.get(id); if(it){ if('photoLocal' in p && it.photoLocal && it.photoLocal!==p.photoLocal) Photos.del(it.photoLocal); m.set(id,Object.assign({},it,p)) } this.save()},
  async delItem(l,id){const m=S.items.get(l); const it=m&&m.get(id); if(it&&it.photoLocal) Photos.del(it.photoLocal); if(m) m.delete(id); this.save()}
};

function errMsg(e){
  const c=e&&e.code;
  if(c==='quota_exceeded') return "La base est pleine. Supprimez des articles pour en ajouter d'autres.";
  if(c==='invalid_argument') return "Modification refusée : vous n'avez que le droit de lecture sur ces listes.";
  return "L'enregistrement a échoué. Vérifiez la connexion et réessayez.";
}
async function save(p){try{await p;return true}catch(e){console.error(e);toast(errMsg(e));return false}}

async function bulk(tasks,label){
  if(!tasks.length) return;
  const total=tasks.length; let done=0;
  showProgress(label,0,total);
  if(S.mode==='local'){
    LocalStore.hold=true;
    try{for(const t of tasks) await t()} finally{LocalStore.hold=false;LocalStore.save();hideProgress()}
    return;
  }
  let i=0,failed=null;
  const worker=async()=>{
    while(i<tasks.length && !failed){
      const t=tasks[i++];
      for(let a=0;;a++){
        try{await t();break}
        catch(e){ if(e&&(e.code==='resource_exhausted'||e.code==='unavailable')&&a<5){await sleep(600*(a+1)+Math.random()*400);continue} failed=e;return }
      }
      done++; if(done%5===0||done===total) showProgress(label,done,total);
    }
  };
  await Promise.all([worker(),worker(),worker()]);
  hideProgress();
  if(failed) toast(errMsg(failed)+' ('+done+'/'+total+' faits)');
}

const listItems=id=>[...(S.items.get(id)||new Map()).values()];
function sectionsOf(list){
  const order=Array.isArray(list.sections)?list.sections.slice():[];
  for(const it of listItems(list.id)){const s=it.section||'Sans section'; if(!order.includes(s)) order.push(s)}
  return order;
}
const byPos=(a,b)=>(a.pos??0)-(b.pos??0)||String(a.code).localeCompare(String(b.code));
const photoSrc=it=>it.photo?('/_blob/'+it.photo):it.photoLocal?(Photos.urls.get(it.photoLocal)||''):(it.photoData||'');
/* photos kept on this device (file / offline mode): IndexedDB, much larger than localStorage */
const Photos={db:null,urls:new Map(),
  open(){ return new Promise(res=>{ try{ const r=indexedDB.open('listes-pdr',1); r.onupgradeneeded=()=>r.result.createObjectStore('photos'); r.onsuccess=()=>{this.db=r.result;res(true)}; r.onerror=()=>res(false) }catch(e){res(false)} }) },
  loadAll(){ return new Promise(res=>{ if(!this.db) return res(); try{ const c=this.db.transaction('photos').objectStore('photos').openCursor(); c.onsuccess=()=>{ const cur=c.result; if(cur){ this.urls.set(cur.key,URL.createObjectURL(cur.value)); cur.continue() } else res() }; c.onerror=()=>res() }catch(e){res()} }) },
  put(key,blob){ return new Promise((res,rej)=>{ const tx=this.db.transaction('photos','readwrite'); tx.objectStore('photos').put(blob,key); tx.oncomplete=()=>{ this.urls.set(key,URL.createObjectURL(blob)); res() }; tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error) }) },
  del(key){ try{ if(this.db) this.db.transaction('photos','readwrite').objectStore('photos').delete(key); const u=this.urls.get(key); if(u) URL.revokeObjectURL(u); this.urls.delete(key) }catch(e){} }
};
function matches(it,q){ if(!q) return true; q=q.toLowerCase(); return String(it.code||'').toLowerCase().includes(q)||String(it.note||'').toLowerCase().includes(q) }
function parseQty(v){ v=String(v==null?'':v).trim().replace(',','.'); if(v==='') return null; const n=Number(v); return isFinite(n)?n:null }
const qtyHtml=q=>q==null?'<span class="qty none">—</span>':'<span class="qty'+(q===0?' zero':'')+'">'+fmt(q)+'</span>';

function renderList(main){

    imp:()=>{closeSheet();importTarget=list.id;$('#file-csv').click()},
    unc:()=>{closeSheet();bulk(ch.map(i=>()=>Store.updateItem(list.id,i.id,{checked:false})),'Décochage')},
    dch:b=>{ if(!ch.length){toast('Aucune pièce cochée.');return} armed(b,()=>{closeSheet();bulk(ch.map(i=>()=>Store.delItem(list.id,i.id)),'Suppression')}) },
    del:b=>armed(b,async()=>{ closeSheet(); const id=list.id; await bulk(its.map(i=>()=>Store.delItem(id,i.id)),'Suppression de la liste'); await save(Store.delList(id)); goHome() })
  });
}
function sectionMenu(sec){
  const list=S.lists.get(V.listId); if(!list) return;
  const secs=sectionsOf(list); const idx=secs.indexOf(sec);
  const its=listItems(list.id).filter(i=>(i.section||'Sans section')===sec);
  openSheet('<h2>Section « '+esc(sec)+' »</h2>'+menuHtml([
    {id:'add',icon:'plus',label:'Ajouter une pièce ici'},
    {id:'ren',icon:'rename',label:'Renommer la section'},
    {id:'up',icon:'up',label:'Monter'},
    {id:'down',icon:'down',label:'Descendre'},
    {id:'del',icon:'trash',label:its.length?'Supprimer la section et ses '+fmt(its.length)+' pièces':'Supprimer la section',danger:true}
  ]));
  const move=d=>{ const a=secs.slice(); const j=idx+d; if(j<0||j>=a.length) return; [a[idx],a[j]]=[a[j],a[idx]]; closeSheet(); save(Store.updateList(list.id,{sections:a})) };
  bindMenu({
    add:()=>{ closeSheet(); V.lastSection[list.id]=sec; ls.set('pdr.lastsec',V.lastSection); $('#add-section').value=sec; $('#add-code').focus() },
    ren:()=>askName('Renommer la section','Nouveau nom',sec,async n=>{
      if(n===sec) return; if(secs.includes(n)){toast('La section « '+n+' » existe déjà.');return}
      await save(Store.updateList(list.id,{sections:secs.map(s=>s===sec?n:s)}));
      bulk(its.map(i=>()=>Store.updateItem(list.id,i.id,{section:n})),'Renommage');
    }),
    up:()=>move(-1), down:()=>move(1),
    del:b=>armed(b,async()=>{ closeSheet(); await bulk(its.map(i=>()=>Store.delItem(list.id,i.id)),'Suppression'); save(Store.updateList(list.id,{sections:(list.sections||[]).filter(s=>s!==sec)})) })
  });
}

/* ---------- item editor ---------- */
let pending=null; // {blob?:Blob, remove?:true, preview?:string}
function editItem(id){
  const list=S.lists.get(V.listId); const it=(S.items.get(V.listId)||new Map()).get(id); if(!list||!it) return;
  pending=null;
  const secs=sectionsOf(list); const src=photoSrc(it);
  openSheet('<h2>'+esc(it.code)+'</h2><form id="item-form" autocomplete="off">'+
    '<div class="field"><label for="f-code">Code</label><input id="f-code" value="'+esc(it.code)+'" autocapitalize="characters" required></div>'+
    '<div class="field"><span class="lab" id="lab-qty">Quantité</span><div class="stepper"><button type="button" data-step="-1" aria-label="Retirer 1">−</button><input id="f-qty" aria-labelledby="lab-qty" inputmode="numeric" value="'+(it.qty==null?'':esc(it.qty))+'"><button type="button" data-step="1" aria-label="Ajouter 1">+</button></div></div>'+
    '<div class="field"><label for="f-section">Section</label><select id="f-section"></select><input id="f-section-new" placeholder="Nom de la nouvelle section" hidden></div>'+
    '<div class="field"><label for="f-note">Note</label><input id="f-note" value="'+esc(it.note||'')+'" placeholder="Ex. 6205 2RS, machine, emplacement…"></div>'+
    '<div class="field"><span class="lab">Photo</span><div class="photo-box"><div id="f-photo">'+(src?'<img src="'+esc(src)+'" alt="Photo de la pièce" data-view="'+esc(src)+'">':'<div class="photo-ph">'+ICON.cam+'</div>')+'</div><div class="photo-btns"><button class="btn" type="button" id="f-cam">'+ICON.cam+'Prendre une photo</button><button class="btn" type="button" id="f-gal">Choisir une image</button><button class="btn" type="button" id="f-rm"'+(src?'':' hidden')+'>Retirer la photo</button></div></div></div>'+
    '<label class="checkline"><input type="checkbox" id="f-checked"'+(it.checked?' checked':'')+'> Pièce cochée</label>'+
    '<div class="actions two"><button class="btn" type="button" id="f-cancel">Annuler</button><button class="btn primary" type="submit" id="f-save">Enregistrer</button></div><div class="del-line"><button class="btn danger" type="button" id="f-del">'+ICON.trash+'Supprimer la pièce</button></div></form>');
  const sel=$('#f-section');
  sel.innerHTML=secs.map(s=>'<option'+(s===(it.section||'Sans section')?' selected':'')+'>'+esc(s)+'</option>').join('')+'<option value="__new">+ Nouvelle section…</option>';
  sel.onchange=()=>{ $('#f-section-new').hidden=sel.value!=='__new'; if(sel.value==='__new') $('#f-section-new').focus() };
  $('#sheet').querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{ const q=$('#f-qty'); const n=(parseQty(q.value)||0)+Number(b.dataset.step); q.value=Math.max(0,n) });
  $('#f-cam').onclick=()=>$('#file-cam').click();
  $('#f-gal').onclick=()=>$('#file-gal').click();
  $('#f-rm').onclick=()=>{ pending={remove:true}; $('#f-photo').innerHTML='<div class="photo-ph">'+ICON.cam+'</div>'; $('#f-rm').hidden=true };
  $('#f-photo').onclick=e=>{ const im=e.target.closest('img'); if(im) openViewer(im.src) };
  $('#f-cancel').onclick=closeSheet;
  $('#f-del').onclick=e=>armed(e.currentTarget,()=>{ closeSheet(); save(Store.delItem(list.id,it.id)).then(ok=>ok&&toast(it.code+' supprimé')) });
  $('#item-form').onsubmit=async e=>{
    e.preventDefault();
    const btn=$('#f-save'); btn.disabled=true; btn.textContent='Enregistrement…';
    const code=$('#f-code').value.trim().toUpperCase();
    let section=sel.value; if(section==='__new') section=$('#f-section-new').value.trim()||it.section||'Sans section';
    const patch={code,qty:parseQty($('#f-qty').value),section,note:$('#f-note').value.trim(),checked:$('#f-checked').checked};
    try{
      if(pending&&pending.remove){ patch.photo=null; patch.photoData=null; patch.photoLocal=null; }
      if(pending&&pending.blob){ Object.assign(patch,await storePhoto(pending.blob)) }
    }catch(err){ console.error(err); toast("La photo n'a pas pu être enregistrée."); btn.disabled=false; btn.textContent='Enregistrer'; return }
    if(!(list.sections||[]).includes(section)) await save(Store.updateList(list.id,{sections:(list.sections||[]).concat(section)}));
    const ok=await save(Store.updateItem(list.id,it.id,patch));
    if(ok) closeSheet(); else { btn.disabled=false; btn.textContent='Enregistrer' }
  };
}
async function onPhotoPicked(e){
  const f=e.target.files&&e.target.files[0]; e.target.value=''; if(!f||$('#sheet-wrap').hidden||!$('#f-photo')) return;
  try{
    const blob=await shrink(f,1280,.82);
    pending={blob};
    const url=URL.createObjectURL(blob);
    $('#f-photo').innerHTML='<img src="'+url+'" alt="Nouvelle photo">'; $('#f-rm').hidden=false;
  }catch(err){ toast("Impossible de lire cette image.") }
}
$('#file-cam').addEventListener('change',onPhotoPicked);
$('#file-gal').addEventListener('change',onPhotoPicked);
async function shrink(file,max,q){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas'); c.width=Math.round(img.naturalWidth*s); c.height=Math.round(img.naturalHeight*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return await new Promise((r,j)=>c.toBlob(b=>b?r(b):j(new Error('toBlob')),'image/jpeg',q));
  } finally { URL.revokeObjectURL(url) }
}
const blobToData=b=>new Promise((r,j)=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.onerror=j;fr.readAsDataURL(b)});
async function storePhoto(blob){
  if(S.mode==='db'&&assets){
    for(let a=0;a<2;a++){
      try{ const r=await assets.upload(blob,{type:'image/jpeg'}); return {photo:r.id,photoData:null} }
      catch(e){ if(e&&e.code==='store_unavailable'&&a===0){await sleep(800);continue} if(e&&(e.code==='not_granted'||e.code==='capability_disabled'||e.code==='capability_removed')) break; throw e }
    }
  }
  if(S.mode==='local'&&Photos.db){ const key='p'+uid(); await Photos.put(key,blob); return {photo:null,photoData:null,photoLocal:key} }
  const small=await shrink(blob,560,.72); return {photo:null,photoData:await blobToData(small),photoLocal:null};
}
function openViewer(src){ $('#viewer-img').src=src; $('#viewer').hidden=false }
$('#viewer').addEventListener('click',()=>{$('#viewer').hidden=true});

/* ---------- CSV ---------- */
let importTarget=null;
function csvCell(v){ v=v==null?'':String(v); return /[;"\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v }
function buildCsv(list,kind){
  const secs=sectionsOf(list); const rows=[];
  const its=listItems(list.id).sort((a,b)=>secs.indexOf(a.section||'Sans section')-secs.indexOf(b.section||'Sans section')||byPos(a,b));
  if(kind==='gmao'){
    rows.push(['Référence','Désignation','Famille','Emplacement','Stock','Mini','Prix unit.','Valeur','Fournisseur']);
    for(const i of its) rows.push([i.code,'non','',i.section||'',i.qty==null?0:i.qty,'',0,0,'']);
  } else {
    rows.push(['Catégorie','Code','Quantité','Note','Coché']);
    for(const i of its) rows.push([i.section||'',i.code,i.qty==null?'':i.qty,i.note||'',i.checked?'Oui':'Non']);
  }
  return '﻿'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n')+'\r\n';
}
async function exportCsv(list,kind){
  const csv=buildCsv(list,kind);
  const d=new Date(); const stamp=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const name=(kind==='gmao'?'pieces-de-rechange-':'liste-')+list.name.replace(/[^\w\-]+/g,'-').replace(/^-+|-+$/g,'')+'-'+stamp+'.csv';
  if(window.AndroidBridge&&window.AndroidBridge.saveFile){ try{ window.AndroidBridge.saveFile(name,csv); return }catch(e){} }
  if(downloads){
    try{ await downloads.save({filename:name,data:csv}); toast('Fichier enregistré : '+name); return }
    catch(e){ if(e&&e.code==='declined') return; if(e&&e.code==='rate_limited'){toast('Un enregistrement est déjà en cours.');return} }
  }
  openSheet('<h2>'+esc(name)+'</h2><p class="note-mode" style="margin-top:0">Le téléchargement n\'est pas disponible ici. Copiez le texte puis collez-le dans un fichier .csv.</p><textarea class="csv" id="csv-out" readonly></textarea><div class="actions" style="margin-top:12px"><button class="btn" type="button" id="f-cancel">Fermer</button><button class="btn primary" type="button" id="f-copy">Copier</button></div>');
  $('#csv-out').value=csv.slice(1);
  $('#f-cancel').onclick=closeSheet;
  $('#f-copy').onclick=()=>{ navigator.clipboard.writeText(csv.slice(1)).then(()=>toast('Copié.'),()=>{ const t=$('#csv-out'); t.focus(); t.select(); toast('Sélectionné : utilisez Copier du téléphone.') }) };
}
function parseCsv(text){
  text=text.replace(/^﻿/,'');
  const first=text.split(/\r?\n/,1)[0]||''; const sep=(first.split(';').length>=first.split(',').length)?';':',';
  const rows=[]; let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++} else q=false } else cell+=c }
    else if(c==='"') q=true;
    else if(c===sep){ row.push(cell); cell='' }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(cell); rows.push(row); row=[]; cell='' }
    else cell+=c;
  }
  if(cell!==''||row.length){ row.push(cell); rows.push(row) }
  return rows.filter(r=>r.some(c=>c.trim()!==''));
}
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z]/g,'');
function mapRows(rows){
  if(!rows.length) return [];
  const h=rows[0].map(norm); const find=(...names)=>h.findIndex(x=>names.includes(x));
  let iCode=find('code','reference','ref','codepiece','article'), iQty=find('quantite','qte','stock','qty','quantity'), iSec=find('categorie','section','emplacement','category'), iNote=find('note','notes','designation','description'), iChk=find('coche','checked','barre');
  let body=rows.slice(1);
  if(iCode<0){ iCode=0; iQty=rows[0].length>1?1:-1; body=rows }
  return body.map(r=>{
    const code=String(r[iCode]||'').trim(); if(!code) return null;
    let note=iNote>=0?String(r[iNote]||'').trim():''; if(note.toLowerCase()==='non') note='';
    const chk=iChk>=0?/^(oui|yes|1|x|vrai|true)$/i.test(String(r[iChk]||'').trim()):false;
    return {code,qty:iQty>=0?parseQty(r[iQty]):null,section:(iSec>=0?String(r[iSec]||'').trim():'')||'Général',note,checked:chk};
  }).filter(Boolean);
}
$('#file-csv').addEventListener('change',async e=>{
  const f=e.target.files&&e.target.files[0]; e.target.value=''; if(!f) return;
  let buf; try{ buf=await f.arrayBuffer() }catch(err){ toast('Impossible de lire ce fichier.'); return }
  let text=new TextDecoder('utf-8').decode(buf); if(text.includes('�')) text=new TextDecoder('windows-1252').decode(buf);
  const recs=mapRows(parseCsv(text));
  if(!recs.length){ toast('Aucune pièce trouvée dans ce fichier. Il faut au moins une colonne « Code » ou « Référence ».'); return }
  const secs=[]; for(const r of recs) if(!secs.includes(r.section)) secs.push(r.section);
  let listId=importTarget;
  if(!listId){
    const name=f.name.replace(/\.[^.]+$/,'').replace(/[-_ ]?\d{4}-\d{2}-\d{2}$/,'').replace(/[-_]+/g,' ').trim()||'Liste importée';
    listId=await createList(name,secs); if(!listId) return;
  } else {
    const list=S.lists.get(listId); const cur=list.sections||[];
    const add=secs.filter(s=>!cur.includes(s)); if(add.length) await save(Store.updateList(listId,{sections:cur.concat(add)}));
  }
  const base=Date.now();
  await bulk(recs.map((r,k)=>()=>Store.setItem(listId,uid()+k.toString(36),Object.assign(r,{pos:base+k}))),'Import de '+recs.length+' pièces');
  toast(fmt(recs.length)+' pièces importées.');
});

/* ---------- toast & progress ---------- */
let toastT=0;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>{t.hidden=true},3200) }
function showProgress(label,done,total){ const t=$('#toast'); clearTimeout(toastT); t.hidden=false; t.innerHTML=esc(label)+' : '+fmt(done)+' / '+fmt(total)+'<div class="progress"><i style="width:'+(total?Math.round(done*100/total):0)+'%"></i></div>' }
function hideProgress(){ $('#toast').hidden=true }

/* ---------- boot ---------- */
render();
(async()=>{
  let db=null;
  try{ if(window.claude&&window.claude.use) db=await window.claude.use('db') }catch(e){ db=null }
  if(db){ S.mode='db'; Store=DbStore; DbStore.init(db);
    try{ assets=await window.claude.use('assets') }catch(e){ assets=null }
  } else { S.mode='local'; Store=LocalStore; await Photos.open(); await Photos.loadAll(); LocalStore.init() }
  try{ if(window.claude&&window.claude.use) downloads=await window.claude.use('downloads') }catch(e){ downloads=null }
})();
})();
</script>
